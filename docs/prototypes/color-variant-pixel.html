<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>版本 B · 复古像素风</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FFF9E6;
      --white: #FFFFFF;
      --accent: #FFADAD;
      --brown: #4A3B32;
      --ink: #2E2019;
      --border: 4px solid var(--brown);
      --shadow: 4px 4px 0 var(--brown);
    }
    * { box-sizing: border-box; border-radius: 0 !important; }
    body {
      margin: 0;
      font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif;
      background-color: var(--cream);
      background-image:
        linear-gradient(45deg, var(--accent) 25%, transparent 25%),
        linear-gradient(-45deg, var(--accent) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--accent) 75%),
        linear-gradient(-45deg, transparent 75%, var(--accent) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      color: var(--ink);
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }

    .app-header {
      background: var(--white);
      border-bottom: var(--border);
      box-shadow: 0 4px 0 var(--brown);
      padding: 12px 0;
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 20px; }
    .brand-icon {
      width: 42px; height: 42px; background: var(--accent);
      border: var(--border); display: grid; place-items: center; font-size: 22px;
      box-shadow: var(--shadow);
    }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      padding: 8px 16px; border: var(--border);
      background: var(--white); font-weight: 900; font-size: 13px;
      box-shadow: var(--shadow); cursor: pointer;
    }
    .btn.primary { background: var(--accent); }

    .page-head { padding: 28px 0 14px; }
    .page-head h1 { margin: 0 0 4px; font-size: 26px; }
    .page-head p { margin: 0; color: #6b5b4f; font-weight: 800; font-size: 14px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .tag {
      padding: 6px 12px; border: var(--border);
      background: var(--white); font-weight: 900; font-size: 12px;
      box-shadow: 3px 3px 0 var(--brown);
    }
    .tag.active { background: var(--accent); }
    .spacer { flex: 1; }
    .search {
      padding: 8px 12px; border: var(--border);
      background: var(--white); font-weight: 800; font-size: 13px;
      box-shadow: 3px 3px 0 var(--brown);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--white); border: var(--border); box-shadow: var(--shadow);
    }
    .card-thumb {
      height: 130px; background: var(--cream);
      border-bottom: var(--border);
      display: grid; place-items: center; font-size: 52px;
    }
    .card-body { padding: 10px; }
    .card-title { font-weight: 900; font-size: 14px; margin-bottom: 6px; }
    .card-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      padding: 3px 8px; border: 2px solid var(--brown);
      background: var(--white); font-size: 11px; font-weight: 900;
    }
    .card-actions { display: flex; gap: 6px; padding: 0 10px 10px; }
    .icon-btn {
      width: 30px; height: 30px; border: 3px solid var(--brown);
      background: var(--white); display: grid; place-items: center;
      font-size: 13px; box-shadow: 2px 2px 0 var(--brown); cursor: pointer;
    }
    .icon-btn.danger { background: var(--accent); }

    .section-title {
      display: inline-block; margin: 32px 0 14px;
      background: var(--accent); border: var(--border);
      padding: 6px 14px; font-weight: 900; font-size: 17px;
      box-shadow: var(--shadow);
    }

    .upload-zone {
      border: 4px dashed var(--brown);
      background: var(--white); padding: 46px 20px; text-align: center;
      box-shadow: var(--shadow);
    }
    .upload-zone .icon { font-size: 48px; margin-bottom: 8px; }
    .upload-zone p { margin: 4px 0; font-weight: 900; }

    .login-card {
      max-width: 400px; margin: 28px auto;
      background: var(--white); border: var(--border); box-shadow: var(--shadow);
    }
    .login-head {
      padding: 14px; border-bottom: var(--border); background: var(--accent);
      font-weight: 900; text-align: center;
    }
    .login-body { padding: 18px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-weight: 900; margin-bottom: 4px; font-size: 13px; }
    .field input {
      width: 100%; padding: 10px 12px; border: var(--border);
      background: var(--cream); font-weight: 800; box-shadow: 2px 2px 0 var(--brown) inset;
    }
    .login-footer { padding: 0 18px 18px; text-align: center; }
    .text-btn { background: none; border: none; font-weight: 900; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand"><div class="brand-icon">🐰</div><span>糖果图库</span></div>
      <nav class="nav">
        <button class="btn primary">画廊</button>
        <button class="btn">上传</button>
        <button class="btn">分类</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>我的糖果图库</h1>
      <p>复古像素风 · 零圆角 · 棋盘格背景 · 粗 4px 描边</p>
    </div>

    <div class="toolbar">
      <span class="tag active">全部</span>
      <span class="tag">旅行</span>
      <span class="tag">美食</span>
      <span class="tag">宠物</span>
      <span class="spacer"></span>
      <input class="search" placeholder="🔍 搜索图片名称" />
      <button class="btn primary">+ 上传</button>
    </div>

    <div class="gallery">
      <div class="card">
        <div class="card-thumb">🏔️</div>
        <div class="card-body">
          <div class="card-title">mountain.jpg</div>
          <div class="card-meta"><span class="badge">旅行</span><span class="badge">2.4 MB</span></div>
        </div>
        <div class="card-actions">
          <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
        </div>
      </div>
      <div class="card">
        <div class="card-thumb">🍰</div>
        <div class="card-body">
          <div class="card-title">cake.jpg</div>
          <div class="card-meta"><span class="badge">美食</span><span class="badge">1.1 MB</span></div>
        </div>
        <div class="card-actions">
          <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
        </div>
      </div>
      <div class="card">
        <div class="card-thumb">🐱</div>
        <div class="card-body">
          <div class="card-title">cat.png</div>
          <div class="card-meta"><span class="badge">宠物</span><span class="badge">3.2 MB</span></div>
        </div>
        <div class="card-actions">
          <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
        </div>
      </div>
    </div>

    <div class="section-title">上传页</div>
    <div class="upload-zone">
      <div class="icon">📦</div>
      <p>把图片拖到这里，或者点击上传</p>
    </div>

    <div class="section-title">登录页</div>
    <div class="login-card">
      <div class="login-head">欢迎回到糖果图库 🍬</div>
      <div class="login-body">
        <div class="field"><label>用户名</label><input placeholder="请输入用户名" /></div>
        <div class="field"><label>密码</label><input type="password" placeholder="请输入密码" /></div>
      </div>
      <div class="login-footer">
        <button class="btn primary" style="width:100%;margin-bottom:10px;">登录</button>
        <div>还没有账号？ <button class="text-btn">注册一个</button></div>
      </div>
    </div>
  </main>
</body>
</html>
