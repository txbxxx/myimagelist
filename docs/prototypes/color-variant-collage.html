<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>版本 C · 剪纸拼贴风</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #FFF9E6;
      --white: #FFFFFF;
      --accent: #CAFFBF;
      --brown: #4A3B32;
      --ink: #2E2019;
      --border: 3px solid var(--brown);
      --shadow: 5px 5px 0 var(--brown);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif;
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 25% 25%, rgba(202,255,191,.6) 0 8px, transparent 9px),
        radial-gradient(circle at 75% 75%, rgba(202,255,191,.6) 0 8px, transparent 9px);
      background-size: 40px 40px;
      color: var(--ink);
      line-height: 1.55;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px 40px; }

    .app-header {
      background: var(--white);
      border-bottom: var(--border);
      box-shadow: 0 5px 0 var(--brown);
      padding: 14px 0;
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 22px; }
    .brand-icon {
      width: 44px; height: 44px; background: var(--accent);
      border: var(--border); border-radius: 6px;
      display: grid; place-items: center; font-size: 24px;
      box-shadow: var(--shadow); transform: rotate(-3deg);
    }
    .nav { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 9px 20px; border: var(--border); border-radius: 4px;
      background: var(--white); font-weight: 900; font-size: 14px;
      box-shadow: var(--shadow); cursor: pointer;
    }
    .btn.primary { background: var(--accent); transform: rotate(-1deg); }

    .page-head { padding: 34px 0 18px; }
    .page-head h1 {
      margin: 0 0 8px; font-size: 30px;
      display: inline-block; background: var(--accent);
      border: var(--border); border-radius: 4px; padding: 8px 18px;
      box-shadow: var(--shadow); transform: rotate(-2deg);
    }
    .page-head p { margin: 0; color: #6b5b4f; font-weight: 800; }

    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
    .tag {
      padding: 7px 16px; border: var(--border); border-radius: 4px;
      background: var(--white); font-weight: 900; font-size: 13px;
      box-shadow: 3px 3px 0 var(--brown);
    }
    .tag.active { background: var(--accent); }
    .spacer { flex: 1; }
    .search {
      padding: 10px 16px; border: var(--border); border-radius: 4px;
      background: var(--white); font-weight: 800; font-size: 14px;
      box-shadow: 3px 3px 0 var(--brown);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 26px;
    }
    .card-wrap {
      position: relative;
    }
    .card {
      background: var(--white); border: var(--border); border-radius: 6px;
      box-shadow: var(--shadow);
      position: relative; z-index: 2;
    }
    .card::before {
      content: '';
      position: absolute; top: 10px; left: 10px; right: -10px; bottom: -10px;
      background: var(--accent); border: var(--border); border-radius: 6px;
      z-index: -1;
    }
    .card-thumb {
      height: 140px; background: var(--cream);
      border-bottom: 3px dashed var(--brown);
      display: grid; place-items: center; font-size: 56px;
    }
    .card-body { padding: 12px; }
    .card-title { font-weight: 900; font-size: 15px; margin-bottom: 6px; }
    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge {
      padding: 4px 10px; border: 2px solid var(--brown); border-radius: 4px;
      background: var(--white); font-size: 11px; font-weight: 900;
    }
    .card-actions { display: flex; gap: 8px; padding: 0 12px 12px; }
    .icon-btn {
      width: 32px; height: 32px; border: 2.5px solid var(--brown); border-radius: 4px;
      background: var(--white); display: grid; place-items: center;
      font-size: 14px; box-shadow: 2px 2px 0 var(--brown); cursor: pointer;
    }
    .icon-btn.danger { background: var(--accent); }

    .section-title {
      display: inline-block; margin: 40px 0 18px;
      background: var(--accent); border: var(--border); border-radius: 4px;
      padding: 8px 16px; font-weight: 900; font-size: 18px;
      box-shadow: var(--shadow); transform: rotate(1deg);
    }

    .upload-zone {
      border: 3px dashed var(--brown); border-radius: 6px;
      background: var(--white); padding: 52px 20px; text-align: center;
      box-shadow: var(--shadow); position: relative;
    }
    .upload-zone::after {
      content: '✨';
      position: absolute; top: -18px; right: -12px; font-size: 32px;
    }
    .upload-zone .icon { font-size: 52px; margin-bottom: 10px; }
    .upload-zone p { margin: 4px 0; font-weight: 900; }

    .login-card {
      max-width: 430px; margin: 32px auto;
      background: var(--white); border: var(--border); border-radius: 6px;
      box-shadow: var(--shadow); position: relative;
    }
    .login-card::before {
      content: '';
      position: absolute; top: -14px; left: 30px; width: 60px; height: 26px;
      background: rgba(202,255,191,.6); border: 2px solid var(--brown);
      transform: rotate(-4deg); z-index: 3;
    }
    .login-head {
      padding: 16px; border-bottom: var(--border); background: var(--accent);
      font-weight: 900; text-align: center; border-radius: 6px 6px 0 0;
    }
    .login-body { padding: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 900; margin-bottom: 5px; }
    .field input {
      width: 100%; padding: 11px 12px; border: var(--border); border-radius: 4px;
      background: var(--cream); font-weight: 800; box-shadow: 2px 2px 0 var(--brown) inset;
    }
    .login-footer { padding: 0 20px 20px; text-align: center; }
    .text-btn { background: none; border: none; font-weight: 900; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand"><div class="brand-icon">🐰</div><span>糖果图库</span></div>
      <nav class="nav">
        <button class="btn primary">画廊</button>
        <button class="btn">上传</button>
        <button class="btn">分类</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>我的糖果图库</h1>
      <p>剪纸拼贴风 · 薄荷绿点缀 · 错位阴影 · 波点背景</p>
    </div>

    <div class="toolbar">
      <span class="tag active">全部</span>
      <span class="tag">旅行</span>
      <span class="tag">美食</span>
      <span class="tag">宠物</span>
      <span class="spacer"></span>
      <input class="search" placeholder="🔍 搜索图片名称" />
      <button class="btn primary">+ 上传</button>
    </div>

    <div class="gallery">
      <div class="card-wrap">
        <div class="card">
          <div class="card-thumb">🏔️</div>
          <div class="card-body">
            <div class="card-title">mountain.jpg</div>
            <div class="card-meta"><span class="badge">旅行</span><span class="badge">2.4 MB</span></div>
          </div>
          <div class="card-actions">
            <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
          </div>
        </div>
      </div>
      <div class="card-wrap">
        <div class="card">
          <div class="card-thumb">🍰</div>
          <div class="card-body">
            <div class="card-title">cake.jpg</div>
            <div class="card-meta"><span class="badge">美食</span><span class="badge">1.1 MB</span></div>
          </div>
          <div class="card-actions">
            <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
          </div>
        </div>
      </div>
      <div class="card-wrap">
        <div class="card">
          <div class="card-thumb">🐱</div>
          <div class="card-body">
            <div class="card-title">cat.png</div>
            <div class="card-meta"><span class="badge">宠物</span><span class="badge">3.2 MB</span></div>
          </div>
          <div class="card-actions">
            <button class="icon-btn">⬇️</button><button class="icon-btn">✏️</button><button class="icon-btn danger">🗑️</button>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title">上传页</div>
    <div class="upload-zone">
      <div class="icon">📦</div>
      <p>把图片拖到这里，或者点击上传</p>
    </div>

    <div class="section-title">登录页</div>
    <div class="login-card">
      <div class="login-head">欢迎回到糖果图库 🍬</div>
      <div class="login-body">
        <div class="field"><label>用户名</label><input placeholder="请输入用户名" /></div>
        <div class="field"><label>密码</label><input type="password" placeholder="请输入密码" /></div>
      </div>
      <div class="login-footer">
        <button class="btn primary" style="width:100%;margin-bottom:10px;">登录</button>
        <div>还没有账号？ <button class="text-btn">注册一个</button></div>
      </div>
    </div>
  </main>
</body>
</html>
