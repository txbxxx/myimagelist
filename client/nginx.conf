# nginx 静态托管 + 反代 /api 和 /uploads 到后端容器
#
# 关键点：
# 1. SPA fallback：所有没匹配到的路径 → /index.html（Vue Router 用 hash 模式，所以其实不需要
#    try_files，但留着更稳，以后切 history 模式也兼容）
# 2. /api/* 反代到后端 server 容器（同 compose 网络，service 名直接当 hostname）
# 3. /uploads/* 反代到后端，让前端能直接 <img src="/uploads/xxx"> 显示
# 4. 上传限制：client_max_body_size 要 ≥ 服务端的 multer limit（默认 100MB）
# 5. 静态资源长缓存（dist/ 里有 hash 文件名）；index.html 不缓存（让版本切换生效）

upstream api_backend {
    server server:3000;
}

server {
    listen 80;
    server_name _;

    # 上传文件大小：与服务端 multer limit 保持一致（默认 100MB）
    client_max_body_size 100m;

    # 静态资源（dist/）
    root /usr/share/nginx/html;
    index index.html;

    # 反代：API
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 视频/大文件上传需要关掉缓冲
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_read_timeout  300s;
    }

    # 反代：uploads（本地存储模式的图片/视频直链；COS 模式下不会命中这里）
    # 也覆盖 /uploads/thumbs/... 视频缩略图路径
    location /uploads/ {
        proxy_pass         http://api_backend;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 7d;
        expires            7d;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 长缓存：带 hash 的构建产物
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存（部署后版本能立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
